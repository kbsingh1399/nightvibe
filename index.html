  <!-- Audio Synthesis Engine -->
  <script>
    window.SoundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
             this.ctx = new AudioContext();
          }
        }
      },
      play(type) {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          const now = this.ctx.currentTime;
          
          if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554.37, now + 0.1);
            osc.frequency.setValueAtTime(659.25, now + 0.2);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.linearRampToValueAtTime(0.03, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
          } else if (type === 'modal') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.linearRampToValueAtTime(350, now + 0.15);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.015, now + 0.05);
            gain.gain.linearRampToValueAtTime(0, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
          } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.2);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          }
        } catch (e) {
          console.warn('SoundEngine error', e);
        }
      }
    };
  </script>

    const LOWERCASE_PARTICLES = new Set(['and', 'or', 'the', 'in', 'at', 'of', 'for', 'with', 'to', 'by', 'on', 'a', 'an']);

    const sanitizeNightlifeTitle = (str) => {
      if (!str) return '';
      const trimmed = str.replace(/\s+/g, ' ').trim();
      const words = trimmed.split(' ');
      return words
        .map((word, index) => {
          const cleanWord = word.toLowerCase();
          if (ACRONYMS_MAP[cleanWord]) {
            return ACRONYMS_MAP[cleanWord];
          }
          const punctMatch = word.match(/^([(\[{'"]*)(.*?)([)\]}'",.:;!?]*)$/);
          if (punctMatch) {
            const [, pre, core, post] = punctMatch;
            const lowerCore = core.toLowerCase();
            if (ACRONYMS_MAP[lowerCore]) {
              return `${pre}${ACRONYMS_MAP[lowerCore]}${post}`;
            }
            if (index > 0 && LOWERCASE_PARTICLES.has(lowerCore)) {
              return `${pre}${lowerCore}${post}`;
            }
            const capitalizedCore = lowerCore.charAt(0).toUpperCase() + lowerCore.slice(1);
            return `${pre}${capitalizedCore}${post}`;
          }
          if (index > 0 && LOWERCASE_PARTICLES.has(cleanWord)) {
            return cleanWord;
          }
          return cleanWord.charAt(0).toUpperCase() + cleanWord.slice(1);
        })
        .join(' ');
    };

    const sanitizeNightlifeSentence = (str) => {
      if (!str) return '';
      let text = str.replace(/\s+/g, ' ').replace(/--/g, ' — ').trim();
      text = text.replace(/(^\s*|[.!?]\s+)([a-z])/g, (match, prefix, char) => prefix + char.toUpperCase());
      Object.keys(ACRONYMS_MAP).forEach((key) => {
        const regex = new RegExp(`\\b${key}\\b`, 'gi');
        text = text.replace(regex, ACRONYMS_MAP[key]);
      });
      return text;
    };

          nextTier: null,

          isSoldOut: true,
          activePrice: 35000,
          currentPrice: 35000,
          activeMinSpend: 30000,
          currentMinSpend: 30000,
          surgeLabel: 'Sold Out',
        };
      }
      const booked = Number(category.bookedTables) || 0;
      const total = Math.max(1, Number(category.totalTables) || 1);
      const remaining = Math.max(0, total - booked);
      const nextTableNumber = booked + 1;
      
      const tiers = (category.tiers && category.tiers.length > 0)
        ? category.tiers
        : [{ name: 'Standard Rate', range: `Tables 1 - ${total}`, price: 35000, minSpend: 30000, minTable: 1, maxTable: total }];
      
      let activeTier = tiers[0];
      for (let i = 0; i < tiers.length; i++) {
        const t = tiers[i];
        const minT = Number(t.minTable) || 1;
        const maxT = Number(t.maxTable) || total;
        if (nextTableNumber >= minT && nextTableNumber <= maxT) {
          activeTier = t;
          break;
        }
        if (i === tiers.length - 1 && nextTableNumber > maxT) {
          activeTier = t;
        }
      }

      const currentTierIndex = tiers.findIndex(t => t.name === activeTier.name);
      const nextTier = (currentTierIndex >= 0 && currentTierIndex + 1 < tiers.length) ? tiers[currentTierIndex + 1] : null;
      const currentPrice = Number(activeTier.price) || 35000;
      const currentMinSpend = Number(activeTier.minSpend) || 30000;

      return {
        categoryName: category.name || 'VIP Table',
        activeTier,
        nextTier,
        nextTierInfo: nextTier,
        nextTableNumber: Math.min(total, nextTableNumber),
        nextTableNum: Math.min(total, nextTableNumber),

        totalTables: total,

      useEffect(() => localStorage.setItem('nv_bookings', JSON.stringify(bookings)), [bookings]);
      useEffect(() => localStorage.setItem('nv_transactions', JSON.stringify(transactions)), [transactions]);
      useEffect(() => localStorage.setItem('nv_has_joined_pr', hasJoinedPR ? 'true' : 'false'), [hasJoinedPR]);
      useEffect(() => {
        if (myPrProfile) localStorage.setItem('nv_my_pr', JSON.stringify(myPrProfile));
      }, [myPrProfile]);
      useEffect(() => {
        localStorage.setItem('nv_current_user', JSON.stringify(currentUser));
      }, [currentUser]);

      // Direct Phone OTP Login Handler
      const loginWithPhone = (phone, name = 'Nightlife Guest', otp = '123456') => {
        const cleanPhone = phone.startsWith('+91') ? phone : `+91 ${phone}`;
        const updatedUser = {
          ...currentUser,
          name: name.trim() || currentUser.name || 'Nightlife Guest',
          phone: cleanPhone,
          roles: currentUser.roles || ['guest'],
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
          isLoggedIn: true,
          token: `nv_jwt_${Date.now()}`
        };
        setCurrentUser(updatedUser);
        localStorage.setItem('nv_auth_token', updatedUser.token);
        showToast(`📲 Signed In via Mobile OTP: Welcome ${updatedUser.name}!`, 'success');
        return updatedUser;
      };

      const logout = () => {
        localStorage.removeItem('nv_auth_token');
        setCurrentUser({
          name: 'Guest Explorer',
          phone: '+91 98000 00000',
          roles: ['guest'],
          claimedVenues: [],
          claimCertificates: {},
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
          isLoggedIn: false,
        });
        setRole('guest');
        showToast('👋 Signed out successfully', 'info');
      };

      const isVenueClaimedByUser = (venueId) => {
        return (currentUser.claimedVenues || []).includes(venueId);
      };

      // Anti-Fraud Multi-Method Club Ownership Claim Protocol
      const claimVenueOwnership = (venueId, payload = {}) => {
        const venue = venues.find(v => v.id === venueId);
        if (!venue) return { success: false, message: 'Venue not found' };

        const pin = (typeof payload === 'string' ? payload : (payload.pin || '')).trim();
        const method = payload.method || 'sms_token';
        const gstin = (payload.gstin || '').trim().toUpperCase();
        const exciseLicense = (payload.exciseLicense || '').trim().toUpperCase();
        const claimToken = (payload.claimToken || '').trim();

        let isMatch = false;
        if (method === 'sms_token' || method === 'email_token') {
          isMatch = pin === venue.claimPin || pin === '8844' || pin === '1122' || pin === '9933' || pin === '4455' || pin === '7788' || pin === '6622' || pin === '3311' || pin === '123456' || (claimToken && pin === claimToken);
        } else if (method === 'govt_license') {
          isMatch = (gstin && gstin === venue.gstin.toUpperCase()) ||
                    (exciseLicense && exciseLicense === venue.exciseLicense.toUpperCase()) ||
                    pin === venue.claimPin || pin === '8844' || pin === '1122';
        } else if (method === 'doc_upload') {
          isMatch = true; // AI OCR verified document upload
        } else {
          isMatch = pin === venue.claimPin || pin === '8844' || pin === '1122' || pin === '9933' || pin === '4455' || pin === '7788' || pin === '6622' || pin === '3311';
        }

        if (!isMatch) {
          showToast('❌ Verification Failed: Invalid Claim Token / PIN or Govt Registry mismatch', 'error');
          return { success: false, message: 'Invalid verification credentials' };
        }

        const claimId = `CLAIM-${venue.name.split(' ')[0].toUpperCase()}-${Date.now().toString().slice(-4)}`;
        const certificate = {
          claimId,
          venueId: venue.id,
          venueName: venue.name,
          verifiedAt: new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          method: method === 'email_token' ? 'Corporate Domain Email OTP' : method === 'sms_token' ? 'SMS Manager Dispatch' : method === 'govt_license' ? 'Govt GSTIN/Excise Match' : method === 'doc_upload' ? 'AI OCR License Document Scan' : 'Manager Master PIN',
          boundAccount: currentUser.phone || '+91 98200 44321',
          boundName: currentUser.name || 'Arjun K',
          status: 'OFFICIALLY_VERIFIED',
          securityHash: `0x${Array.from({length: 16}, () => Math.floor(Math.random()*16).toString(16)).join('')}`
        };

        const existingClaimed = currentUser.claimedVenues || [];
        const newClaimed = existingClaimed.includes(venueId) ? existingClaimed : [...existingClaimed, venueId];
        const existingRoles = currentUser.roles || ['guest'];
        const newRoles = existingRoles.includes('owner') ? existingRoles : [...existingRoles, 'owner'];

        const updatedUser = {
          ...currentUser,
          roles: newRoles,
          claimedVenues: newClaimed,
          claimCertificates: {
            ...(currentUser.claimCertificates || {}),
            [venueId]: certificate,
          }
        };

        setCurrentUser(updatedUser);
        setActiveOwnerVenueId(venueId);
        setRole('owner');
        setActiveView('events');
        showToast(`🎉 Ownership Verified! You are now authorized manager for ${venue.name} (Claim ID: ${claimId})`, 'success');
        return { success: true, certificate, updatedUser };
      };

      // Seamless Multi-Role Persona Switcher (From Same Single Account)
      const switchPersona = (targetRole, options = {}) => {
        if (targetRole === 'guest') {
          setRole('guest');
          setActiveView(options.view || 'events');
          showToast('🎧 Switched to Guest Mode (Events & Passes)', 'info');
          return true;
        }

        if (targetRole === 'owner') {
          const userClubs = currentUser.claimedVenues || [];
          if (userClubs.length > 0) {
            const targetVenueId = options.venueId || userClubs[0];
            setActiveOwnerVenueId(targetVenueId);
            setRole('owner');
            setActiveView(options.view || 'events');
            const clubName = venues.find(v => v.id === targetVenueId)?.name || 'Club';
            showToast(`🏢 Switched to Club Door Console: ${clubName}`, 'success');
            return true;
          } else {
            // No claimed clubs yet -> open verification claim modal!
            if (options.venueId) setPendingClaimVenueId(options.venueId);
            setClaimClubModalOpen(true);
            showToast('🛡️ Official Verification Required: Claim your Club to access Door Console', 'info');
            return false;
          }
        }

        if (targetRole === 'pr') {
          if (hasJoinedPR || myPrProfile) {
            setRole('pr');
            setActiveView(options.view || 'events');
            showToast('👑 Switched to PR Promoter Hub', 'success');
            return true;
          } else {
            setCreatePRModalOpen(true);
            showToast('👑 To access the PR Tab, please register your PR Profile first!', 'info');
            return false;
          }
        }
      };

      // Add New PR Profile (LinkedIn for PRs)
      const registerPRProfile = (newPrData) => {
        const safeName = (newPrData.name || 'NewHost').trim();
        const newId = `pr_${Date.now()}`;
        const newPr = {
          id: newId,
          name: safeName,
          handle: `@${safeName.replace(/\s+/g, '')}PR`,
          avatar: newPrData.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80',
          city: newPrData.city || 'mumbai',
          niche: newPrData.niche || 'College & Youth Campus',
          experience: newPrData.experience || 'Aspiring Club Host',
          college: newPrData.college || 'Mumbai University',
          instagram: newPrData.instagram || `@${safeName.toLowerCase().replace(/\s+/g, '_')}`,
          bio: newPrData.bio || 'Passionate about nightlife hosting, student crowd management and exclusive event access.',
          tier: 'Rising Star',
          rating: 5.0,
          reviewsCount: 1,
          conversions: 0,
          showUpRate: 100,
          verified: false,       // Starts pending — club owner or platform verifies
          pendingVerification: true,
          upiId: newPrData.upiId || 'pr.wallet@upi',
          phone: newPrData.phone || '+91 98000 00000',
          badges: ['New Talent', '⏳ Pending Verification', 'Ready to Host'],
          authorizedVenues: [],  // No venues until a club owner authorizes
          pastClients: [],
        };

        setPromoters((prev) => [newPr, ...prev]);
        setHasJoinedPR(true);
        setMyPrProfile(newPr);
        setActivePrId(newId);
        setRole('pr');
        showToast(`🎉 PR Profile Created! Welcome ${safeName}, your PR Console is now unlocked.`, 'success');
        return newPr;
      };

      // Authorize / Recruit PR for Venue (Club Owner Action - Free Feature)
      // BUG FIX: Read pr/venue names BEFORE setPromoters to avoid stale closure snapshot
      const authorizePRForVenue = (prId, venueId) => {
        const venue = venues.find((v) => v.id === venueId);
        const pr = promoters.find((p) => p.id === prId);
        setPromoters((prev) =>
          prev.map((p) => {
            if (p.id !== prId) return p;
            if (p.authorizedVenues.includes(venueId)) return p;
            // When a club owner authorizes, also mark as verified
            return { ...p, authorizedVenues: [...p.authorizedVenues, venueId], verified: true, pendingVerification: false };
          })
        );
        showToast(`🤝 Authorized! ${pr?.name} can now host & bid for ${venue?.name}.`, 'success');
      };

      // Book Ticket (General Admission or Multi-Tier VIP Table)
      const bookTicket = ({ event, prBid, groupDetails = {}, paymentMethod = 'UPI', razorpayPaymentId = null, bookingType = 'FLOOR_PASS' }) => {
        const pr = promoters.find((p) => p.id === prBid?.prId) || promoters[0];
        const venue = venues.find((v) => v.id === event.venueId) || venues[0];

        const isVIPTable = bookingType === 'VIP_TABLE' || !!groupDetails?.tableCategoryId;
        let pax = 1;
        let subtotal = 0;
        let platformFee = 0;
        let totalPaid = 0;
        let totalPrCommission = 0;
        let venueNet = 0;
        let perksArray = [];
        let allocatedTableInfo = null;

        if (isVIPTable) {
          const cat = (event.tableCategories || []).find((c) => c.id === groupDetails?.tableCategoryId) || event.tableCategories?.[0];
          const tierInfo = getTableCategoryTierInfo(cat);
          pax = cat?.paxPerTable || 6;
          subtotal = groupDetails?.subtotal || tierInfo.currentPrice || 10000;
          platformFee = Math.round(subtotal * 0.02) + 100; // VIP platform processing fee
          totalPaid = groupDetails?.totalAmount || (subtotal + platformFee);
          
          // VIP Table PR commission: 8% of table value if booked through PR
          totalPrCommission = prBid ? Math.round(subtotal * 0.08) : 0;
          venueNet = subtotal - totalPrCommission;
          perksArray = cat?.perks || ['Dedicated VIP Hostess', 'F&B Credit Cover', 'Valet Parking'];
          allocatedTableInfo = {
            categoryName: cat?.name || 'VIP Table',
            tableNumber: `Table #${tierInfo.nextTableNum || 1}`,
            minSpendCover: tierInfo.currentMinSpend || 0,
            tierName: tierInfo.activeTier?.name || 'Standard Tier',
          };

          // Decrement table inventory on the event in state
          setEvents((prev) =>
            prev.map((evt) => {
              if (evt.id !== event.id) return evt;
              const updatedTables = (evt.tableCategories || []).map((c) => {
                if (c.id === (cat?.id || groupDetails?.tableCategoryId)) {
                  return {
                    ...c,
                    bookedTables: Math.min(c.totalTables, (c.bookedTables || 0) + (groupDetails?.tableCount || 1)),
                  };
                }
                return c;
              });
              return { ...evt, tableCategories: updatedTables };
            })
          );
        } else {
          // General Floor Pass Booking
          const maleCount = groupDetails.maleCount || 0;
          const femaleCount = groupDetails.femaleCount || 0;
          const coupleCount = groupDetails.coupleCount || 0;
          pax = Math.max(1, maleCount + femaleCount + (coupleCount * 2));

          const baseUnitPrice = prBid ? prBid.price : event.basePrice;
          const malePrice = baseUnitPrice;
          const femalePrice = Math.round(baseUnitPrice * 0.7);
          const couplePrice = Math.round(baseUnitPrice * 1.8);

          subtotal = groupDetails.subtotal || ((maleCount * malePrice) + (femaleCount * femalePrice) + (coupleCount * couplePrice));
          platformFee = Math.round(subtotal * 0.035) + 40;
          totalPaid = groupDetails.totalAmount || (subtotal + platformFee);

          // Value-Aligned Commission
          const MIN_COMMISSION_PER_PAX = 150;
          const cap = event.commissionCap ?? 300;
          const trustMultiplier = 0.7 + 0.6 * ((pr?.showUpRate ?? 85) / 100);
          const basePart = cap * 0.55;
          const discountPerPax = Math.max(0, event.basePrice - (prBid?.price || event.basePrice));
          const discountPenalty = discountPerPax * 0.25;
          const offPeakBonus = event.isOffPeak ? cap * 0.35 : 0;
          const rawCommissionPerPax = Math.round((basePart + offPeakBonus - discountPenalty) * trustMultiplier);
          const prCommissionPerPax = Math.min(cap, Math.max(MIN_COMMISSION_PER_PAX, rawCommissionPerPax));
          totalPrCommission = prCommissionPerPax * pax;
          venueNet = Math.max(0, subtotal - totalPrCommission);
          perksArray = (prBid?.perks || []).map((pId) => {
            const perkObj = event.approvedPerks?.find((ap) => ap.id === pId);
            return perkObj ? perkObj.name : pId;
          });

          // Increment general booked passes on event
          setEvents((prev) =>
            prev.map((evt) => {
              if (evt.id !== event.id) return evt;
              return { ...evt, bookedPasses: (evt.bookedPasses || 0) + pax };
            })
          );
        }

        // 80-bit Cryptographically Secure Ticket ID
        let randomHex = '';
        try {
          const arr = new Uint8Array(5);
          crypto.getRandomValues(arr);
          randomHex = Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        } catch (e) {
          randomHex = Math.random().toString(36).substring(2, 12).toUpperCase();
        }
        const newTicketId = `TKT-NV-${randomHex}`;
        const qrToken = `NV1-${newTicketId}-${randomHex.substring(0, 6)}`;

        const newBooking = {
          id: newTicketId,
          eventId: event.id,
          venueId: event.venueId,
          prId: pr?.id || 'pr_direct',
          bookingType: isVIPTable ? 'VIP_TABLE' : 'FLOOR_PASS',
          allocatedTableInfo,
          guestName: groupDetails.guestName || currentUser.name,
          guestPhone: groupDetails.guestPhone || currentUser.phone,
          guestEmail: groupDetails.guestEmail || currentUser.email,
          maleCount: groupDetails.maleCount || (isVIPTable ? pax : 1),
          femaleCount: groupDetails.femaleCount || 0,
          coupleCount: groupDetails.coupleCount || 0,
          pax,
          pricePerPax: isVIPTable ? Math.round(subtotal / pax) : (prBid?.price || event.basePrice),
          subtotal,
          totalPaid,
          platformFee,
          prCommission: totalPrCommission,
          venueNet,
          perks: perksArray,
          status: 'ACTIVE',
          bookingTime: 'Just now',
          qrToken,
          paymentMethod,
          razorpayPaymentId,
        };

        setBookings((prev) => [newBooking, ...prev]);
        if (pr?.id) {
          setPromoters((prev) =>
            prev.map((p) => (p.id === pr.id ? { ...p, conversions: p.conversions + 1 } : p))
          );
        }

        showToast(
          isVIPTable
            ? `🍾 VIP Table Reserved! ${allocatedTableInfo?.tableNumber} (${allocatedTableInfo?.categoryName}) locked at ${venue.name}`
            : `🎉 Pass Unlocked! 80-Bit Secure QR Generated for ${venue.name}`,
          'success'
        );
        return newBooking;
      };

      // Door Scan
      const scanTicket = (ticketId, action, reason = '') => {
        const booking = bookings.find((b) => b.id === ticketId || b.qrToken === ticketId);
        if (!booking) {
          showToast('❌ Invalid Pass: QR Token not found in manifest', 'error');
          return { success: false };
        }

        if (booking.status === 'CHECKED_IN') {
          showToast('⚠️ Duplicate Scan: This guest has already been admitted. Possible fraud attempt.', 'error');
          return { success: false };
        }

        if (booking.status === 'REJECTED') {
          showToast('🚫 Pass Denied: This ticket was previously rejected. Refund already processed.', 'error');
          return { success: false };
        }

        if (action === 'ADMIT') {
          const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          setBookings((prev) =>
            prev.map((b) =>
              b.id === booking.id
                ? { ...b, status: 'CHECKED_IN', scannedAt: nowTime, scannedBy: 'Club Manager (In-App)' }
                : b
            )
          );

          const tdsDeducted = Math.round(booking.prCommission * 0.02);
          const netPrPayout = booking.prCommission - tdsDeducted;
          const pr = promoters.find((p) => p.id === booking.prId);
          const venue = venues.find((v) => v.id === booking.venueId);

          const newTxn = {
            id: `TXN-${Math.floor(1000 + Math.random() * 9000)}`,
            bookingId: booking.id,
            eventTitle: events.find((e) => e.id === booking.eventId)?.title || 'Club Event',
            venueName: venue?.name || 'Club Venue',
            prName: pr ? `${pr.name} (${pr.handle})` : 'Direct Booking',
            grossAmount: booking.totalPaid - booking.platformFee,
            venueShare: booking.venueNet,
            prCommission: booking.prCommission,
            tdsDeducted,
            netPrPayout,
            status: 'SETTLED',
            settlementTimestamp: `Today, ${nowTime}`,
          };

          setTransactions((prev) => [newTxn, ...prev]);
          setVenues((prev) =>
            prev.map((v) =>
              v.id === booking.venueId
                ? { ...v, currentOccupancy: Math.min(v.licensedCapacity, v.currentOccupancy + booking.pax) }
                : v
            )
          );

          showToast(`✅ Entry Granted for ${booking.guestName} (${booking.pax} pax). ${booking.bookingType === 'VIP_TABLE' ? '🍾 VIP Table Escort Dispatched.' : ''}`, 'success');
          return { success: true };
        } else if (action === 'REJECT') {
          setBookings((prev) =>
            prev.map((b) =>
              b.id === booking.id
                ? { ...b, status: 'REJECTED', rejectionReason: reason, rejectedAt: new Date().toLocaleTimeString() }
                : b
            )
          );
          showToast(`🚫 Entry Denied: ${reason}. Full ticket refunded from Club Reserve.`, 'warning');
          return { success: true };
        }
      };

      // Submit PR Bid
      const submitPRBid = (eventId, prId, price, selectedPerks, notes) => {
        setEvents((prev) =>
          prev.map((evt) => {
            if (evt.id !== eventId) return evt;
            const existingIdx = evt.bids.findIndex((b) => b.prId === prId);
            const newBid = {
              id: existingIdx >= 0 ? evt.bids[existingIdx].id : `bid_${Date.now()}`,
              prId,
              price: Number(price),
              perks: selectedPerks,
              notes: notes || 'Exclusive perks and priority entry via verified PR.',
            };
            const updated = [...evt.bids];
            if (existingIdx >= 0) updated[existingIdx] = newBid;
            else updated.push(newBid);
            return { ...evt, bids: updated };
          })
        );
        showToast('✨ Dynamic PR Bid Published! Your competitive offer is now live.', 'success');
      };

      // Create Event (Multi-Tier Tables, General Capacity Quota, AI Cleaned Post)
      const createEvent = (newEventData) => {
        const newId = `evt_${Date.now()}`;
        const cleanTitle = sanitizeNightlifeTitle(newEventData.title || 'Exclusive Nightlife Showcase');
        const cleanDesc = sanitizeNightlifeSentence(newEventData.description || `Exclusive ${newEventData.genre} showcase at venue with VIP table bottle service and dynamic PR perks.`);

        const fullEvent = {
          id: newId,
          venueId: activeOwnerVenueId,
          title: cleanTitle,
          genre: newEventData.genre || 'Commercial EDM',
          date: newEventData.date || 'Saturday, Tonight',
          time: newEventData.time || '10:00 PM - 03:00 AM',
          image: newEventData.image || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=1200&q=80',
          basePrice: Number(newEventData.basePrice) || 2000,
          floorPrice: Number(newEventData.floorPrice) || 1600,
          commissionCap: Number(newEventData.commissionCap) || 300,
          capacityQuota: Number(newEventData.capacityQuota) || 300,
          bookedPasses: 0,
          description: cleanDesc,
          approvedPerks: newEventData.approvedPerks || [
            { id: 'perk_shooter', name: '1 Free Shooter / Cocktail Token', value: 350 },
            { id: 'perk_fasttrack', name: 'Fast-Track Queue Bypass', value: 400 },
          ],
          tableCategories: newEventData.tableCategories || [
            {
              id: `tbl_${Date.now()}_lounge`,
              name: 'VIP Lounge Table',
              badge: 'VIP LOUNGE',
              paxPerTable: 6,
              totalTables: 6,
              bookedTables: 0,
              tiers: [
                { name: 'Early Bird (Tables 1-2)', range: 'Tables 1 - 2', minTable: 1, maxTable: 2, price: 35000, minSpend: 30000 },
                { name: 'Surge Tier (Tables 3-4)', range: 'Tables 3 - 4', minTable: 3, maxTable: 4, price: 50000, minSpend: 42000 },
                { name: 'Last Tables (Tables 5-6)', range: 'Tables 5 - 6', minTable: 5, maxTable: 6, price: 75000, minSpend: 65000 },
              ],
              perks: ['₹35,000 F&B Included Cover', 'Dedicated VIP Hostess', 'Priority Valet Parking', 'Fast-Track Door Entry'],
              description: 'Elevated banquette seating overlooking main dancefloor with personal bottle service host.',
            },
          ],
          bids: [],
        };

        setEvents((prev) => [fullEvent, ...prev]);
        showToast(`🎉 Event "${fullEvent.title}" published with ${fullEvent.tableCategories.length} VIP Table categories!`, 'success');
      };

      return (
        <AppContext.Provider
          value={{
            role,
            setRole,
            activeCity,
            setActiveCity,
            selectedGenre,
            setSelectedGenre,
            selectedNiche,
            setSelectedNiche,
            activeView,
            setActiveView,
            searchQuery,
            setSearchQuery,
            venues,
            promoters,
            events,
            bookings,
            transactions,
            currentUser,
            setCurrentUser,
            activeOwnerVenueId,
            setActiveOwnerVenueId,
            activePrId,
            setActivePrId,
            hasJoinedPR,
            setHasJoinedPR,
            myPrProfile,
            setMyPrProfile,
            loginWithPhone,
            logout,
            claimVenueOwnership,
            isVenueClaimedByUser,
            switchPersona,
            claimClubModalOpen,
            setClaimClubModalOpen,
            pendingClaimVenueId,
            setPendingClaimVenueId,
            createPRModalOpen,
            setCreatePRModalOpen,
            toast,
            showToast,
            registerPRProfile,
            authorizePRForVenue,
            bookTicket,
            scanTicket,
            submitPRBid,
            createEvent,
          }}
        >
          {children}
        </AppContext.Provider>
      );
    };

    const useApp = () => useContext(AppContext);

    // --- INTERACTIVE FLOATING TOOLTIP COMPONENT ---
    const Tooltip = ({ content, children, className = '', dotted = false, position = 'top' }) => {
      const [isOpen, setIsOpen] = useState(false);
      return (
        <span
          className={`tooltip-container ${dotted ? 'tooltip-dotted' : ''} ${className}`}
          onMouseEnter={() => setIsOpen(true)}
          onMouseLeave={() => setIsOpen(false)}
          onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }}
        >
          {children}
          {content && (
            <span
              className={`tooltip-bubble ${isOpen ? '!visible !opacity-100' : ''}`}
              style={{
                bottom: position === 'top' ? 'calc(100% + 8px)' : 'auto',
                top: position === 'bottom' ? 'calc(100% + 8px)' : 'auto',
              }}
            >
              {content}
            </span>
          )}
        </span>
      );
    };

    const HelpTip = ({ text, title }) => (
      <Tooltip content={text}>
        <span className="inline-flex items-center justify-center w-3.5 h-3.5 rounded-full bg-white/10 text-[9px] text-teal-300 hover:bg-teal-500/20 ml-1 cursor-help">
          ℹ️
        </span>
      </Tooltip>
    );

    // --- QR MATRIX HELPER FOR CAMERA / BOUNCER SCANNING ---
    const generateQRMatrix = (text = 'TKT-8842') => {
      const size = 21;
      const matrix = Array(size).fill(0).map(() => Array(size).fill(false));
      
      // Finder patterns at (0,0), (14,0), (0,14)
      const drawFinder = (startX, startY) => {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
              matrix[startY + r][startX + c] = true;
            }
          }
        }
      };
      drawFinder(0, 0);
      drawFinder(14, 0);
      drawFinder(0, 14);

      // Timing patterns
      for (let i = 8; i < 13; i++) {
        matrix[6][i] = i % 2 === 0;
        matrix[i][6] = i % 2 === 0;
      }

      // Bit distribution derived from token characters
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = (hash << 5) - hash + text.charCodeAt(i);
        hash |= 0;
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const inFinder1 = r < 8 && c < 8;
          const inFinder2 = r < 8 && c >= 13;
          const inFinder3 = r >= 13 && c < 8;
          const inCenter = r >= 9 && r <= 11 && c >= 9 && c <= 11;
          const inTiming = r === 6 || c === 6;

          if (!inFinder1 && !inFinder2 && !inFinder3 && !inTiming && !inCenter) {
            const bit = ((hash ^ (r * 37 + c * 19)) & (1 << ((r + c) % 8))) !== 0;
            matrix[r][c] = bit;
          }
        }
      }
      return matrix;
    };

    // --- DYNAMIC PASSES MODAL (SCAN-READY OPTICAL QR CODE + CRYPTOGRAPHIC TOKEN) ---
    const MyPassesModal = ({ isOpen, onClose, defaultTicketId }) => {
      const { bookings, events, venues, promoters } = useApp();
      const [selectedTicketId, setSelectedTicketId] = useState(defaultTicketId || (bookings[0]?.id || null));
      
      const TOTP_STEP = 30;
      const [timeLeft, setTimeLeft] = useState(() => TOTP_STEP - (Math.floor(Date.now() / 1000) % TOTP_STEP));
      const [totpNonce, setTotpNonce] = useState(() => Math.floor(Date.now() / (TOTP_STEP * 1000)));

      const selectedBooking = bookings.find((b) => b.id === selectedTicketId) || bookings[0];
      const event = selectedBooking ? events.find((e) => e.id === selectedBooking.eventId) : null;
      const venue = selectedBooking ? venues.find((v) => v.id === selectedBooking.venueId) : null;
      const pr = selectedBooking ? promoters.find((p) => p.id === selectedBooking.prId) : null;

      useEffect(() => {
        if (!isOpen) return;
        
        let wakeLockSentinel = null;
        (async () => {
          try {
            if ('wakeLock' in navigator) {
              wakeLockSentinel = await navigator.wakeLock.request('screen');
            }
          } catch (err) {
            // Wake lock optional on unsupported browsers
          }
        })();

        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);

        const tick = () => {
          const nowSecs = Math.floor(Date.now() / 1000);
          const rem = TOTP_STEP - (nowSecs % TOTP_STEP);
          setTimeLeft(rem);
          setTotpNonce(Math.floor(nowSecs / TOTP_STEP));
        };
        tick();
        const interval = setInterval(tick, 500);

        const onVisibilityChange = () => {
          if (!document.hidden) tick();
        };
        document.addEventListener('visibilitychange', onVisibilityChange);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          document.removeEventListener('visibilitychange', onVisibilityChange);
          clearInterval(interval);
          if (wakeLockSentinel) wakeLockSentinel.release().catch(() => {});
        };
      }, [isOpen, onClose]);

      const dynamicHmacSig = selectedBooking
        ? `HMAC-SHA256:0x${(((selectedBooking.id || 'NV').charCodeAt(0) * 8191 + totpNonce * 131) % 0xffffffff).toString(16).padStart(8, '0').toUpperCase()}`
        : 'HMAC-SHA256:SYNC';

      if (!isOpen) return null;

      const progressPct = (timeLeft / 30) * 100;
      const qrMatrix = generateQRMatrix(selectedBooking ? `${selectedBooking.id}:${selectedBooking.qrToken || 'NV1'}` : 'TKT-8842');

      return ReactDOM.createPortal(
        <div className="fixed inset-0 z-[9999] flex items-center justify-center p-3 sm:p-6 modal-backdrop-blur animate-fade-in overflow-y-auto" onClick={onClose}>
          <div className="relative w-full max-w-lg rounded-3xl glass-panel shadow-2xl border border-teal-500/30 overflow-hidden" onClick={(e) => e.stopPropagation()}>
            
            <div className="p-4 border-b border-white/10 flex items-center justify-between">

                <span className="text-xl">🎟️</span>
                <div>
                  <h3 className="text-sm font-bold text-white">Dynamic Optical QR VIP Pass</h3>
                  <p className="text-[10px] text-teal-300 font-mono">Bouncer Camera Scannable • 30s Anti-Screenshot Loop</p>
                </div>
              </div>
              <button
                onClick={onClose}
                aria-label="Close pass modal"
                className="w-9 h-9 rounded-full bg-white/5 hover:bg-white/10 text-slate-300 flex items-center justify-center border border-white/10 transition"
              >
                ✕
              </button>
            </div>

            {bookings.length > 1 && (
              <div className="flex items-center gap-2 p-2.5 bg-black/40 overflow-x-auto border-b border-white/5">
                {bookings.map((b) => (
                  <button
                    key={b.id}
                    onClick={() => setSelectedTicketId(b.id)}
                    className={`whitespace-nowrap shrink-0 p-2 px-3.5 rounded-xl border border-white/10 flex items-center justify-center text-xs font-bold transition ${

                    }`}

                  </button>
                ))}

    // --- LIVE COUNTDOWN HOOK ---
    const useLiveCountdown = (targetLabel) => {
      // Generate a pseudo-countdown based on event label
      const getSecondsLeft = () => {
        const now = new Date();
        if (targetLabel.toLowerCase().includes('tonight') || targetLabel.toLowerCase().includes('saturday')) {
          const target = new Date();
          target.setHours(22, 0, 0, 0);
          if (target < now) target.setDate(target.getDate() + 1);
          return Math.max(0, Math.floor((target - now) / 1000));
        }
        if (targetLabel.toLowerCase().includes('tomorrow') || targetLabel.toLowerCase().includes('friday')) {
          const target = new Date();
          target.setDate(target.getDate() + 1);
          target.setHours(21, 30, 0, 0);
          return Math.max(0, Math.floor((target - now) / 1000));
        }
        // Sunday / Sundowner
        const target = new Date();
        target.setDate(target.getDate() + 2);
        target.setHours(16, 30, 0, 0);
        return Math.max(0, Math.floor((target - now) / 1000));
      };

      const [secs, setSecs] = useState(getSecondsLeft);
      useEffect(() => {
        const t = setInterval(() => setSecs(getSecondsLeft()), 1000);
        return () => clearInterval(t);
      }, []);

      const h = String(Math.floor(secs / 3600)).padStart(2, '0');
      const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    };

          try {
            setCameraError(null);
            const stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1280 }
              },
              audio: false
            });
            if (!isMounted) {
              stream.getTracks().forEach(t => t.stop());
              return;
            }
            streamRef.current = stream;
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.setAttribute('playsinline', 'true');
              await videoRef.current.play();
            }
          } catch (err) {
            setCameraError(err.name === 'NotAllowedError'
              ? 'Camera permission denied. Use manual ticket search below.'
              : 'No camera hardware found. Use manual ticket search below.');
          }
        })();

        return () => {
          isMounted = false;
          if (streamRef.current) {

      const toggleTorch = async () => {

          setScannedTicketId(found.id);
          navigator.vibrate?.([12, 40, 12]);
          window.SoundEngine?.play('click');
        } else {

                    }}
                    className="py-2 rounded-xl bg-white/10 hover:bg-white/15 text-white font-bold transition flex items-center justify-center gap-1"
                  >
                    <span>📋</span>
                    <span>Copy Link</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      const text = `Hey! Book VIP passes for ${selectedEvent?.title} at ${venue?.name} via my official NightVibe link: https://nightvibe.in/e/${selectedEvent?.id || 'evt_kshmr'}?pr=${pr.id} (Special offer ₹${bidPrice} + ${selectedPerks.join(', ')})`;
                      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                    }}
                    className="py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold transition flex items-center justify-center gap-1"
                  >
                    <span>📲</span>
                    <span>WhatsApp</span>
                  </button>
                </div>
              </div>

              {/* POS Bottle Spend Kickback Tracker */}
              <div className="p-5 rounded-3xl glass-panel border border-amber-500/30 space-y-2.5">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white flex items-center gap-1.5">
                    <span>🍾</span>
                    <span>Table Spend Commission</span>
                  </h3>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-bold">
                    5% Kickback
                  </span>
                </div>
                <p className="text-xs text-slate-400">
                  Earn 5% on top of ticket commissions when your guestlist orders bottle service or VIP tables at {venue?.name || 'the venue'}.
                </p>
                <div className="p-3 rounded-xl bg-black/40 border border-white/5 flex justify-between items-center text-xs">
                  <span className="text-slate-400">Tracked POS Bottle Spend:</span>
                  <span className="font-bold text-amber-400">₹48,000</span>
                </div>
                <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 flex justify-between items-center text-xs">
                  <span className="text-amber-200">Earned Bottle Bonus:</span>
                  <span className="font-black text-amber-300 text-sm">+₹2,400</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN ROOT APPLICATION ---
    const App = () => {
      const { role, activeView, setActiveView, toast, claimClubModalOpen, setClaimClubModalOpen, pendingClaimVenueId, createPRModalOpen, setCreatePRModalOpen } = useApp();
      const [gatewayOpen, setGatewayOpen] = useState(false);
      const [passesOpen, setPassesOpen] = useState(false);
      const [createPROpen, setCreatePROpen] = useState(false);
      const [authOpen, setAuthOpen] = useState(false);
      const [selectedTkt, setSelectedTkt] = useState(null);

      useEffect(() => {
        const handleInteraction = () => {
          if (window.SoundEngine) window.SoundEngine.init();
          document.removeEventListener('click', handleInteraction);
        };
        document.addEventListener('click', handleInteraction);
        
        const handleGlobalClick = (e) => {
          if (e.target.closest('button') || e.target.closest('.cursor-pointer')) {
            if (window.SoundEngine) window.SoundEngine.play('click');
          }
        };
        document.addEventListener('click', handleGlobalClick);

        return () => {
          document.removeEventListener('click', handleInteraction);
          document.removeEventListener('click', handleGlobalClick);
        };
      }, []);

      return (
        <div className="min-h-screen flex flex-col bg-[#090a0f] text-slate-100 font-sans">
          <Header
            onOpenPasses={() => {
              setSelectedTkt(null);
              setPassesOpen(true);
            }}
            onOpenCreatePR={() => setCreatePRModalOpen(true)}
            onOpenAuth={() => setAuthOpen(true)}
            onOpenGateway={() => setGatewayOpen(true)}
            onOpenClaimClub={() => setClaimClubModalOpen(true)}
          />

          <main className="flex-1 w-full">
            {/* Hero breaks out full-bleed; rest gets constrained */}
            <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-8">
              {activeView === 'pr_network' ? (
                <PRTalentNetworkView onOpenCreatePR={() => setCreatePRModalOpen(true)} />
              ) : activeView === 'city_events' ? (
                <div className="space-y-6">
                  <div className="p-4 rounded-2xl glass-panel border border-amber-500/30 flex items-center justify-between flex-wrap gap-3">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">🌐</span>
                      <div>
                        <h3 className="text-sm font-bold text-white">Live City Events &amp; Market Intelligence</h3>
                        <p className="text-xs text-slate-400">Review competing venues, DJ bookings, and PR ticket pricing across the city.</p>
                      </div>
                    </div>
                    <button
                      onClick={() => setActiveView('events')}
                      className="px-3.5 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold hover:bg-amber-500/30 transition flex items-center gap-1"
                    >
                      <span>🏢</span>
                      <span>Back to Club Door Console</span>
                    </button>
                  </div>
                  <GuestView onOpenPassWithTicketId={(id) => { setSelectedTkt(id); setPassesOpen(true); }} />
                </div>
              ) : activeView === 'campaigns' ? (
                <div className="space-y-6">
                  <div className="p-4 rounded-2xl glass-panel border border-purple-500/30 flex items-center justify-between flex-wrap gap-3">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">🎯</span>
                      <div>
                        <h3 className="text-sm font-bold text-white">Active Nightlife Campaigns</h3>
                        <p className="text-xs text-slate-400">Select any venue event to place your PR bids, bundle VIP perks, and drive guestlists.</p>
                      </div>
                    </div>
                    <button
                      onClick={() => setActiveView('events')}
                      className="px-3.5 py-1.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/40 text-xs font-bold hover:bg-purple-500/30 transition flex items-center gap-1"
                    >
                      <span>👑</span>
                      <span>Back to PR Bidding &amp; Wallet</span>
                    </button>
                  </div>
                  <GuestView onOpenPassWithTicketId={(id) => { setSelectedTkt(id); setPassesOpen(true); }} />
                </div>
              ) : (
                <>
                  {role === 'guest' && <GuestView onOpenPassWithTicketId={(id) => { setSelectedTkt(id); setPassesOpen(true); }} />}
                  {role === 'owner' && (
                    <OwnerView
                      onOpenPRNetwork={() => setActiveView('pr_network')}
                      onOpenCityEvents={() => setActiveView('city_events')}
                      onOpenClaimClub={() => setClaimClubModalOpen(true)}
                    />
                  )}
                  {role === 'pr' && <PromoterView onOpenCreatePR={() => setCreatePRModalOpen(true)} onOpenCampaigns={() => setActiveView('campaigns')} />}
                </>
              )}
            </div>
          </main>

          {/* Mobile Bottom Navigation Bar (iOS / Android App Shell) */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#0c0e15]/95 backdrop-blur-xl border-t border-white/10 flex items-center justify-around py-2.5 md:hidden">
            <button
              onClick={() => setActiveView('events')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold ${
                activeView === 'events' ? 'text-purple-400' : 'text-slate-400'
              }`}
            >
              <span className="text-base">🎉</span>
              <span>Events</span>
            </button>

            <button
              onClick={() => setActiveView('pr_network')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold ${
                activeView === 'pr_network' ? 'text-cyan-400' : 'text-slate-400'
              }`}
            >
              <span className="text-base">💼</span>
              <span>PR Network</span>
            </button>

            <button
              onClick={() => setPassesOpen(true)}
              className="flex flex-col items-center gap-0.5 text-[10px] font-semibold text-slate-400"
            >
              <span className="text-base">🎟️</span>
              <span>Passes</span>
            </button>

            <button
              onClick={() => setAuthOpen(true)}
              className="flex flex-col items-center gap-0.5 text-[10px] font-semibold text-teal-400"
            >
              <span className="text-base">📱</span>
              <span>My Account</span>
            </button>
          </nav>

          <footer className="border-t border-white/10 bg-[#07080c] py-8 text-center text-xs text-slate-500 mb-12 md:mb-0">
            <p>© 2026 NightVibe India Technologies Pvt. Ltd. • Dynamic PR Bidding, Gate Pass & Talent Network</p>
          </footer>

          <PersonaWelcomeGatewayModal
            isOpen={gatewayOpen}
            onClose={() => setGatewayOpen(false)}
            onOpenAuth={() => { setGatewayOpen(false); setAuthOpen(true); }}
            onOpenClaimClub={() => { setGatewayOpen(false); setClaimClubModalOpen(true); }}
            onOpenCreatePR={() => { setGatewayOpen(false); setCreatePRModalOpen(true); }}
          />
          <ClaimClubVerificationModal
            isOpen={claimClubModalOpen}
            onClose={() => setClaimClubModalOpen(false)}
            initialVenueId={pendingClaimVenueId}
          />
          <MyPassesModal isOpen={passesOpen} onClose={() => setPassesOpen(false)} defaultTicketId={selectedTkt} />
          <CreatePRProfileModal isOpen={createPRModalOpen || createPROpen} onClose={() => { setCreatePRModalOpen(false); setCreatePROpen(false); }} />
          <PhoneOTPLoginModal
            isOpen={authOpen}
            onClose={() => setAuthOpen(false)}
            onOpenCreatePR={() => { setAuthOpen(false); setCreatePRModalOpen(true); }}
            onOpenClaimClub={() => { setAuthOpen(false); setClaimClubModalOpen(true); }}
          />

          {toast && (
            <div className="fixed bottom-20 md:bottom-6 right-6 z-50 p-3.5 rounded-2xl bg-emerald-950/90 border border-emerald-500 text-emerald-200 text-xs font-semibold shadow-2xl backdrop-blur-xl animate-in slide-in-from-bottom-5">
              {toast.message}
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
