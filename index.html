  <script>
    window.SoundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
             this.ctx = new AudioContext();
          }
        }
      },
      play(type) {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          const now = this.ctx.currentTime;
          
          if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
          } else if (type === 'success') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554.37, now + 0.1);
            osc.frequency.setValueAtTime(659.25, now + 0.2);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.linearRampToValueAtTime(0.03, now + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
          } else if (type === 'modal') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.linearRampToValueAtTime(350, now + 0.15);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.015, now + 0.05);
            gain.gain.linearRampToValueAtTime(0, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
          } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.2);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          }
        } catch (e) {
          console.warn('SoundEngine error', e);
        }
      }
    };
  </script>

        setPromoters((prev) =>

      // Book Ticket
      // BUG FIX: commission floor guard — venueNet can never go below 60% of subtotal
      const bookTicket = ({ event, prBid, groupDetails, paymentMethod = 'UPI', razorpayPaymentId = null }) => {
        const pr = promoters.find((p) => p.id === prBid.prId) || promoters[0];
        const venue = venues.find((v) => v.id === event.venueId) || venues[0];

        const pax = Math.max(1, (groupDetails.maleCount || 0) + (groupDetails.femaleCount || 0));

        const platformFee = Math.round(subtotal * 0.035) + 40;
        const totalPaid = subtotal + platformFee;

        // Commission: discount passed + ₹120 base, floored at ₹150, capped so venueNet ≥ 60% of subtotal
        const rawCommissionPerPax = Math.max(150, (event.basePrice - prBid.price) + 120);
        const maxCommissionPerPax = Math.floor(subtotal * 0.40 / pax); // venue always keeps ≥60%
        const prCommissionPerPax = Math.min(rawCommissionPerPax, maxCommissionPerPax);
        const totalPrCommission = prCommissionPerPax * pax;
        const venueNet = Math.max(0, subtotal - totalPrCommission);

        const newTicketId = `TKT-${Math.floor(1000 + Math.random() * 9000)}`;
        const randomHex = Math.random().toString(36).substring(2, 8).toUpperCase();
        const qrToken = `NV1-${newTicketId}-${randomHex}`;

          eventId: event.id,
          venueId: event.venueId,
          prId: pr.id,
          guestName: groupDetails.guestName || currentUser.name,
          guestPhone: groupDetails.guestPhone || currentUser.phone,
          guestEmail: groupDetails.guestEmail || currentUser.email,
          maleCount: groupDetails.maleCount || 1,
          femaleCount: groupDetails.femaleCount || 1,
          pax,
          pricePerPax: prBid.price,
          totalPaid,
          platformFee,
          prCommission: totalPrCommission,
          venueNet,
          perks: prBid.perks.map((pId) => {
            const perkObj = event.approvedPerks?.find((ap) => ap.id === pId);
            return perkObj ? perkObj.name : pId;
          }),
          status: 'ACTIVE',
          bookingTime: 'Just now',
          qrToken,
          paymentMethod,
          razorpayPaymentId,
        };

        setBookings((prev) => [newBooking, ...prev]);
        setPromoters((prev) =>
          prev.map((p) => (p.id === pr.id ? { ...p, conversions: p.conversions + 1 } : p))
        );

        showToast(`🎉 Pass Unlocked! Dynamic QR Generated for ${venue.name}`, 'success');
        return newBooking;
      };

      // Door Scan
      // BUG FIX: Guard REJECTED status separately — distinct toast from CHECKED_IN duplicate
      const scanTicket = (ticketId, action, reason = '') => {
        const booking = bookings.find((b) => b.id === ticketId || b.qrToken === ticketId);
        if (!booking) {
          showToast('❌ Invalid Pass: QR Token not found in manifest', 'error');
          return { success: false };
        }

        if (booking.status === 'CHECKED_IN') {
          showToast('⚠️ Duplicate Scan: This guest has already been admitted. Possible fraud attempt.', 'error');
          return { success: false };
        }

        if (booking.status === 'REJECTED') {
          showToast('🚫 Pass Denied: This ticket was previously rejected. Refund already processed.', 'error');
          return { success: false };
        }

        if (action === 'ADMIT') {
          const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          setBookings((prev) =>
            prev.map((b) =>
              b.id === booking.id
                ? { ...b, status: 'CHECKED_IN', scannedAt: nowTime, scannedBy: 'Club Manager (In-App)' }
                : b
            )
          );

          const tdsDeducted = Math.round(booking.prCommission * 0.02);
          const netPrPayout = booking.prCommission - tdsDeducted;
          const pr = promoters.find((p) => p.id === booking.prId);
          const venue = venues.find((v) => v.id === booking.venueId);

          const newTxn = {
            id: `TXN-${Math.floor(1000 + Math.random() * 9000)}`,
            bookingId: booking.id,
            eventTitle: events.find((e) => e.id === booking.eventId)?.title || 'Club Event',

            grossAmount: booking.totalPaid - booking.platformFee,
            venueShare: booking.venueNet,
            prCommission: booking.prCommission,
            tdsDeducted,
            netPrPayout,
            status: 'SETTLED',
            settlementTimestamp: `Today, ${nowTime}`,
          };

          setTransactions((prev) => [newTxn, ...prev]);
          setVenues((prev) =>
            prev.map((v) =>
              v.id === booking.venueId
                ? { ...v, currentOccupancy: Math.min(v.licensedCapacity, v.currentOccupancy + booking.pax) }
                : v
            )
          );

          showToast(`✅ Entry Granted for ${booking.guestName} (${booking.pax} pax). ₹${netPrPayout} instant commission routed to ${pr?.name}!`, 'success');
          return { success: true };
        } else if (action === 'REJECT') {
          setBookings((prev) =>
            prev.map((b) =>
              b.id === booking.id
                ? { ...b, status: 'REJECTED', rejectionReason: reason, rejectedAt: new Date().toLocaleTimeString() }
                : b
            )
          );
          showToast(`🚫 Entry Denied: ${reason}. Full ticket refunded from Club Reserve.`, 'warning');
          return { success: true };
        }
      };

      // Submit PR Bid

              perks: selectedPerks,
              notes: notes || 'Exclusive perks and priority entry via verified PR.',

            const updated = [...evt.bids];
            if (existingIdx >= 0) updated[existingIdx] = newBid;
            else updated.push(newBid);
            return { ...evt, bids: updated };

    const EventDetailModal = ({ event, isOpen, onClose, onBookingSuccess }) => {
      const { venues, promoters, bookTicket } = useApp();
      
      useEffect(() => {
        if (isOpen && window.SoundEngine) window.SoundEngine.play('modal');
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, onClose]);

      const venue = venues.find((v) => v.id === event.venueId) || venues[0];

      // Composite Bid Ranking Algorithm:
      // Weightings: 40% Price Savings + 30% PR Rating + 20% Verified Show-Up Rate + 10% Perks Diversity
      const scoredBids = [...(event.bids || [])].map((bid) => {
        const pr = promoters.find((p) => p.id === bid.prId) || promoters[0];
        const savings = Math.max(0, event.basePrice - bid.price);
        const savingsScore = (savings / (event.basePrice || 1)) * 40;
        const ratingScore = ((pr.rating || 4.5) / 5) * 30;
        const showUpScore = ((pr.showUpRate || 85) / 100) * 20;
        const perksScore = Math.min(10, (bid.perks?.length || 0) * 3.5);
        const totalScore = Math.round((savingsScore + ratingScore + showUpScore + perksScore) * 10) / 10;
        return { ...bid, compositeScore: totalScore, prData: pr };
      }).sort((a, b) => b.compositeScore - a.compositeScore);

      const [selectedBidId, setSelectedBidId] = useState(scoredBids[0]?.id || null);
      const [maleCount, setMaleCount] = useState(1);
      const [femaleCount, setFemaleCount] = useState(1);
      const [paymentStep, setPaymentStep] = useState('select');
      const [paymentMethod, setPaymentMethod] = useState('UPI_GPAY');

      const selectedBid = scoredBids.find((b) => b.id === selectedBidId) || scoredBids[0];
      const selectedPR = selectedBid?.prData || promoters[0];

      const totalPax = maleCount + femaleCount;
      const unitPrice = selectedBid ? selectedBid.price : event.basePrice;
      const subtotal = unitPrice * totalPax;
      const platformFee = Math.round(subtotal * 0.035) + 40;
      const totalAmount = subtotal + platformFee;

        const options = {
          key: 'rzp_test_dummy123',
          amount: totalAmount * 100, // paise
          currency: 'INR',
          name: 'NightVibe India',
          description: `Pass for ${event.title}`,

            const newBooking = bookTicket({
              event,
              prBid: selectedBid,
              groupDetails: { maleCount, femaleCount },
              paymentMethod: 'RAZORPAY_LIVE_MODAL',
              razorpayPaymentId: response.razorpay_payment_id || 'pay_test_' + Date.now(),
            });
            onBookingSuccess(newBooking);
            onClose();
          },
          prefill: {
            name: 'Guest User',
            email: 'guest@nightvibe.in',
            contact: '+91 9876543210',
          },
          theme: {
            color: '#14b8a6', // Teal 500
          },
        };

        if (window.Razorpay) {
          const rzp = new window.Razorpay(options);
          rzp.on('payment.failed', function (response){
            alert(`Payment Failed: ${response.error.description}`);
          });
          rzp.open();
        } else {
          // Fallback if SDK fails to load (e.g. adblocker)
          alert('Razorpay SDK blocked or failed to load. Simulating success...');
          if (window.SoundEngine) window.SoundEngine.play('success');
          window.confetti && window.confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } });
          const newBooking = bookTicket({
            event,
            prBid: selectedBid,
            groupDetails: { maleCount, femaleCount },
            paymentMethod: 'BYPASS_RAZORPAY',
          });
          onBookingSuccess(newBooking);
          onClose();
        }
      };

      if (!isOpen || !event) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/85 backdrop-blur-md overflow-y-auto" onClick={onClose}>
          <div className="relative w-full max-w-3xl rounded-3xl glass-panel my-8 shadow-2xl border border-teal-500/30 overflow-hidden" onClick={(e) => e.stopPropagation()}>

                onClick={onClose}
                aria-label="Close modal"
                className="absolute top-4 right-4 p-2.5 rounded-full bg-black/60 hover:bg-black/80 text-white backdrop-blur-md transition flex items-center justify-center w-10 h-10 border border-white/10"
              >
                ✕
              </button>

              <div className="absolute bottom-4 left-6 right-6 flex flex-col sm:flex-row sm:items-end justify-between gap-2">

      const { bookings, events, venues, promoters } = useApp();
      const [selectedTicketId, setSelectedTicketId] = useState(defaultTicketId || (bookings[0]?.id || null));
      const [timeLeft, setTimeLeft] = useState(30);
      const [totpNonce, setTotpNonce] = useState(Math.floor(Date.now() / 30000));
      const qrCanvasRef = useRef(null);

      const selectedBooking = bookings.find((b) => b.id === selectedTicketId) || bookings[0];
      const event = selectedBooking ? events.find((e) => e.id === selectedBooking.eventId) : null;
      const venue = selectedBooking ? venues.find((v) => v.id === selectedBooking.venueId) : null;
      const pr = selectedBooking ? promoters.find((p) => p.id === selectedBooking.prId) : null;

      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        const interval = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              setTotpNonce(Math.floor(Date.now() / 30000));
              return 30;
            }
            return prev - 1;
          });
        }, 1000);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          clearInterval(interval);
        };
      }, [isOpen, onClose]);

      // Simulated Cryptographic HMAC-SHA256 Token Signature:
      const dynamicHmacSig = selectedBooking
        ? `HMAC-SHA256:0x${((selectedBooking.id.charCodeAt(0) * 8191 + totpNonce * 131) % 0xffffffff).toString(16).padStart(8, '0').toUpperCase()}`
        : 'HMAC-SHA256:SYNC';

      useEffect(() => {
        if (!selectedBooking || !qrCanvasRef.current || !window.QRCode) return;
        const payload = JSON.stringify({
          tkt: selectedBooking.id,
          totp: totpNonce,
          sig: dynamicHmacSig,
          pax: selectedBooking.pax,
          m: selectedBooking.maleCount,
          f: selectedBooking.femaleCount,
          ts: Date.now(),
        });
        window.QRCode.toCanvas(qrCanvasRef.current, payload, { width: 190, margin: 1 });
      }, [selectedBooking, totpNonce, dynamicHmacSig]);

      if (!isOpen) return null;

      const progressPct = (timeLeft / 30) * 100;

    // --- LIVE COUNTDOWN HOOK ---
    const useLiveCountdown = (targetLabel) => {
      // Generate a pseudo-countdown based on event label
      const getSecondsLeft = () => {
        const now = new Date();
        if (targetLabel.toLowerCase().includes('tonight') || targetLabel.toLowerCase().includes('saturday')) {
          const target = new Date();
          target.setHours(22, 0, 0, 0);
          if (target < now) target.setDate(target.getDate() + 1);
          return Math.max(0, Math.floor((target - now) / 1000));
        }
        if (targetLabel.toLowerCase().includes('tomorrow') || targetLabel.toLowerCase().includes('friday')) {
          const target = new Date();
          target.setDate(target.getDate() + 1);
          target.setHours(21, 30, 0, 0);
          return Math.max(0, Math.floor((target - now) / 1000));
        }
        // Sunday / Sundowner
        const target = new Date();
        target.setDate(target.getDate() + 2);
        target.setHours(16, 30, 0, 0);
        return Math.max(0, Math.floor((target - now) / 1000));
      };

      const [secs, setSecs] = useState(getSecondsLeft);
      useEffect(() => {
        const t = setInterval(() => setSecs(getSecondsLeft()), 1000);
        return () => clearInterval(t);
      }, []);

      const h = String(Math.floor(secs / 3600)).padStart(2, '0');
      const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
      const s = String(secs % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    };

      const { promoters, activePrId, setActivePrId, events, venues, bookings, submitPRBid, showToast } = useApp();
      const pr = promoters.find((p) => p.id === activePrId) || promoters[0];
      const authorizedEvents = events.filter((e) => pr.authorizedVenues.includes(e.venueId));

      const [selectedEventId, setSelectedEventId] = useState(authorizedEvents[0]?.id || events[0]?.id);
      const selectedEvent = events.find((e) => e.id === selectedEventId) || events[0];
      const currentBid = selectedEvent?.bids?.find((b) => b.prId === pr.id);

      const [bidPrice, setBidPrice] = useState(currentBid?.price || selectedEvent?.floorPrice || 1600);
      const [selectedPerks, setSelectedPerks] = useState(currentBid?.perks || ['perk_shooter', 'perk_fasttrack']);
      const [bidNotes, setBidNotes] = useState(currentBid?.notes || 'Exclusive fast-track entry + free shooter on arrival.');

      const prBookings = bookings.filter((b) => b.prId === pr.id);
      const scannedBookings = prBookings.filter((b) => b.status === 'CHECKED_IN');
      const unlockedEarnings = scannedBookings.reduce((acc, b) => acc + (b.prCommission - Math.round(b.prCommission * 0.02)), 0);

      const discountGiven = selectedEvent ? Math.max(0, selectedEvent.basePrice - bidPrice) : 0;
      const estimatedGrossCommission = Math.max(150, discountGiven + 120);
      const estimatedTds = Math.round(estimatedGrossCommission * 0.02);
      const estimatedNetPayout = estimatedGrossCommission - estimatedTds;

      const handleSaveBid = (e) => {
        e.preventDefault();
        submitPRBid(selectedEvent.id, pr.id, bidPrice, selectedPerks, bidNotes);
      };

      const handleWithdraw = () => {
        if (unlockedEarnings <= 0) return;
        window.confetti && window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        showToast(`⚡ ₹${unlockedEarnings} routed instantly to ${pr.upiId} via UPI Payout!`, 'success');
      };

      return (
        <div className="space-y-6">
          {/* PR Profile Header */}
          <div className="p-5 rounded-3xl glass-panel border border-cyan-500/20 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <img src={pr.avatar} alt={pr.name} className="w-14 h-14 rounded-2xl object-cover ring-2 ring-cyan-500/50" />
              <div>
                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300">
                  {pr.tier} PR • ⭐ {pr.rating}
                </span>
                <h2 className="text-xl font-black text-white">{pr.name} <span className="text-xs text-slate-400">({pr.handle})</span></h2>
                <p className="text-xs text-slate-400">Specialization: <span className="text-cyan-300 font-semibold">{pr.niche}</span> • {pr.college}</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={onOpenCreatePR}
                className="px-3 py-1.5 rounded-xl bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 text-xs font-bold"
              >
                Edit My PR Profile
              </button>

              <select
                value={activePrId}
                onChange={(e) => setActivePrId(e.target.value)}
                className="px-3 py-1.5 rounded-xl bg-black/40 border border-white/10 text-xs text-white"
              >
                {promoters.map((p) => (
                  <option key={p.id} value={p.id}>{p.name}</option>
                ))}
              </select>
            </div>
          </div>

          {/* Wallet & Stats */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="p-4 rounded-2xl glass-panel border border-cyan-500/30 space-y-1.5">
              <span className="text-xs text-cyan-300 font-semibold block">Unlocked PR Wallet</span>
              <div className="text-2xl font-black text-white">₹{unlockedEarnings}</div>
              <button
                onClick={handleWithdraw}
                disabled={unlockedEarnings <= 0}
                className="w-full py-1 rounded-xl bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 text-black text-xs font-bold transition"
              >
                Instant UPI Withdrawal
              </button>
            </div>

            <div className="p-4 rounded-2xl glass-panel border border-white/10 space-y-1">
              <span className="text-xs text-slate-400 block">Verified Admissions</span>
              <div className="text-2xl font-black text-emerald-400">
                {scannedBookings.reduce((a, b) => a + b.pax, 0)} Pax
              </div>
              <p className="text-[10px] text-slate-400">{scannedBookings.length} confirmed door entries</p>
            </div>

            <div className="p-4 rounded-2xl glass-panel border border-white/10 space-y-1">
              <span className="text-xs text-slate-400 block">PR Trust Score</span>
              <div className="text-2xl font-black text-purple-300">{pr.showUpRate}%</div>
              <p className="text-[10px] text-emerald-400">⭐ {pr.rating} (Zero Disputes)</p>
            </div>
          </div>

          {/* Dynamic Bidding Console */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 p-5 rounded-3xl glass-panel border border-white/10 space-y-4">
              <h3 className="text-sm font-bold text-white">Dynamic Bidding Engine</h3>
              
              <div className="space-y-1.5">
                <label className="block text-xs text-slate-300 font-semibold">Select Campaign</label>
                <select
                  value={selectedEventId}
                  onChange={(e) => setSelectedEventId(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/10 text-xs text-white"
                >
                  {authorizedEvents.map((evt) => (
                    <option key={evt.id} value={evt.id}>{evt.title}</option>
                  ))}
                </select>
              </div>

              {selectedEvent && (
                <div className="space-y-3 p-3.5 rounded-2xl bg-black/30 border border-white/5">
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-slate-300">Your Offer Price:</span>
                    <span className="text-lg font-black text-cyan-300">₹{bidPrice}</span>
                  </div>
                  <input
                    type="range"
                    min={selectedEvent.floorPrice}
                    max={selectedEvent.basePrice}
                    step={50}
                    value={bidPrice}
                    onChange={(e) => setBidPrice(Number(e.target.value))}
                    className="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-cyan-400"
                  />
                  <div className="flex justify-between text-[10px] text-slate-500">
                    <span>Floor: ₹{selectedEvent.floorPrice}</span>
                    <span>Official: ₹{selectedEvent.basePrice}</span>
                  </div>
                </div>
              )}

              <div className="space-y-1.5">
                <label className="block text-xs text-slate-300 font-semibold">Pitch Note</label>
                <input
                  type="text"
                  value={bidNotes}
                  onChange={(e) => setBidNotes(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-xs text-white"
                />
              </div>

              <button
                onClick={handleSaveBid}
                className="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-black text-xs font-black shadow-lg"
              >
                Publish Dynamic Bid Offer
              </button>
            </div>

            <div className="lg:col-span-5 p-5 rounded-3xl glass-panel border border-cyan-500/30 space-y-3">
              <h3 className="text-sm font-bold text-white">Live Commission Yield Breakdown</h3>
              <div className="p-3.5 rounded-2xl bg-black/40 border border-white/5 space-y-2 text-xs">
                <div className="flex justify-between text-slate-400">
                  <span>Guest Discount:</span>
                  <span className="text-white">₹{discountGiven}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>Gross Commission:</span>
                  <span className="text-cyan-300 font-bold">₹{estimatedGrossCommission}</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>2% Section 194H TDS:</span>
                  <span className="text-rose-400">-₹{estimatedTds}</span>
                </div>
                <div className="pt-2 border-t border-white/10 flex justify-between text-sm font-bold text-white">
                  <span>Net Payout / Pax:</span>
                  <span className="text-emerald-400">₹{estimatedNetPayout}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN ROOT APPLICATION ---
    const App = () => {
      const { role, activeView, setActiveView, toast } = useApp();
      const [passesOpen, setPassesOpen] = useState(false);
      const [createPROpen, setCreatePROpen] = useState(false);
      const [selectedTkt, setSelectedTkt] = useState(null);

      useEffect(() => {
        const handleInteraction = () => {
          if (window.SoundEngine) window.SoundEngine.init();
          document.removeEventListener('click', handleInteraction);
        };
        document.addEventListener('click', handleInteraction);
        
        const handleGlobalClick = (e) => {
          if (e.target.closest('button') || e.target.closest('.cursor-pointer')) {
            if (window.SoundEngine) window.SoundEngine.play('click');
          }
        };
        document.addEventListener('click', handleGlobalClick);

        return () => {
          document.removeEventListener('click', handleInteraction);
          document.removeEventListener('click', handleGlobalClick);
        };
      }, []);

      return (
        <div className="min-h-screen flex flex-col bg-[#090a0f] text-slate-100 font-sans">
          <Header
            onOpenPasses={() => {
              setSelectedTkt(null);
              setPassesOpen(true);
            }}
            onOpenCreatePR={() => setCreatePROpen(true)}
            onOpenAuth={() => alert('Current Active User: Arjun Kapoor')}
          />

          <main className="flex-1 w-full">
            {/* Hero breaks out full-bleed; rest gets constrained */}
            <div className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-8">
            {activeView === 'pr_network' ? (
              <PRTalentNetworkView onOpenCreatePR={() => setCreatePROpen(true)} />
            ) : (
              <>
                {role === 'guest' && <GuestView onOpenPassWithTicketId={(id) => { setSelectedTkt(id); setPassesOpen(true); }} />}
                {role === 'owner' && <OwnerView onOpenPRNetwork={() => setActiveView('pr_network')} />}
                {role === 'pr' && <PromoterView onOpenCreatePR={() => setCreatePROpen(true)} />}
              </>
            )}
            </div>
          </main>

          {/* Mobile Bottom Navigation Bar (iOS / Android App Shell) */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#0c0e15]/95 backdrop-blur-xl border-t border-white/10 flex items-center justify-around py-2.5 md:hidden">
            <button
              onClick={() => setActiveView('events')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold ${
                activeView === 'events' ? 'text-purple-400' : 'text-slate-400'
              }`}
            >
              <span className="text-base">🎉</span>
              <span>Events</span>
            </button>

            <button
              onClick={() => setActiveView('pr_network')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold ${
                activeView === 'pr_network' ? 'text-cyan-400' : 'text-slate-400'
              }`}
            >
              <span className="text-base">💼</span>
              <span>PR Network</span>
            </button>

            <button
              onClick={() => setPassesOpen(true)}
              className="flex flex-col items-center gap-0.5 text-[10px] font-semibold text-slate-400"
            >
              <span className="text-base">🎟️</span>
              <span>Passes</span>
            </button>

            <button
              onClick={() => setCreatePROpen(true)}
              className="flex flex-col items-center gap-0.5 text-[10px] font-semibold text-pink-400"
            >
              <span className="text-base">✨</span>
              <span>Join PR</span>
            </button>
          </nav>

          <footer className="border-t border-white/10 bg-[#07080c] py-8 text-center text-xs text-slate-500 mb-12 md:mb-0">
            <p>© 2026 NightVibe India Technologies Pvt. Ltd. • Dynamic PR Bidding, Gate Pass & Talent Network</p>
          </footer>

          <MyPassesModal isOpen={passesOpen} onClose={() => setPassesOpen(false)} defaultTicketId={selectedTkt} />
          <CreatePRProfileModal isOpen={createPROpen} onClose={() => setCreatePROpen(false)} />

          {toast && (
            <div className="fixed bottom-20 md:bottom-6 right-6 z-50 p-3.5 rounded-2xl bg-emerald-950/90 border border-emerald-500 text-emerald-200 text-xs font-semibold shadow-2xl backdrop-blur-xl animate-in slide-in-from-bottom-5">
              {toast.message}
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
